name: Propose a collaboration / Proponi una collaborazione
description: Suggest one small contribution to medicines documents, legislation or AI evaluation.
title: "[Collaboration]: "
labels: ["collaboration"]
body:
  - type: markdown
    attributes:
      value: |
        English or Italian is welcome. This is a public documentation repository, not the application source. Read CONTRIBUTING.md first. For a private introduction, use the website contact route. Do not post personal clinical cases, credentials or confidential information. A proposal does not create a partnership or commit funding.
  - type: dropdown
    id: workstream
    attributes:
      label: Area / Ambito
      options:
        - Official medicines documents (AIFA, RCP/FI)
        - Italian pharmaceutical legislation
        - Clinical evidence and guidelines
        - AI evaluation and pharmacist review
        - Documentation and developer onboarding
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Relevant expertise / Esperienza pertinente
      description: Briefly describe your role and relevant public work. Do not include private contact details.
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: First deliverable / Primo contributo
      description: What small result could you help produce or review? Include scope, needed support and realistic availability.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public references / Riferimenti pubblici
      description: Optional official-source links, existing issue references or public projects relevant to the proposal.
  - type: checkboxes
    id: public-scope
    attributes:
      label: Public scope / Perimetro pubblico
      options:
        - label: I have not included patient data, credentials, private conversations or confidential material.
          required: true
